<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1ЦЭГЦ</title>
    <!-- Pre-resolve DNS + TLS for QPay hosts so tapping a payment link
         (pay-by-app button, share link, QR fallback) skips the connection
         setup — worth a few hundred ms on mobile networks. -->
    <link rel="preconnect" href="https://qpay.mn" />
    <link rel="preconnect" href="https://s.qpay.mn" />
    <!-- The site's only two fonts. Both ship cyrillic-ext, where Mongolian
         Ө ө Ү ү live; fonts without it (e.g. Playfair Display) drop those
         letters to a fallback mid-word. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..800;1,400..800&family=Golos+Text:wght@400..700&display=swap" />
    <script>
      // Prevent libraries from trying to polyfill fetch if it already exists
      // This fixes "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
      if (window.fetch) {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: false,
            enumerable: true,
            get: () => originalFetch,
            set: () => { 
              console.warn('A library tried to overwrite window.fetch. This operation was blocked.');
            }
          });
        } catch (e) {
          // Property might already be non-configurable, which is fine
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
